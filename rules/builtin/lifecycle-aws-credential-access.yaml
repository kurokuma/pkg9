metadata:
  id: package.lifecycle_aws_credential_access
  name: AWS Credential Access in Lifecycle Script
  description: Detects lifecycle scripts that reference AWS credentials.
  severity: high
  confidence: high
  tags: [npm, lifecycle, credentials]
  category: credential-access
  namespace: builtin
  rule_source: builtin
  rule_version: "1.0.0"
  schema_version: "1"
  min_engine_version: "0.1.0"
  references:
    - https://raw.githubusercontent.com/DNSZLSK/muad-dib/master/src/rules/index.js
scope: file
selectors:
  ecosystems: [npm]
  path_glob: ["package.json"]
conditions:
  regex:
    pattern: '(?is)"(?:preinstall|install|postinstall|prepare|prepack)"\s*:\s*"[^"\n]*AWS_[A-Z_]+'
emit:
  finding_name: lifecycle_aws_credential_access
  message: package.json lifecycle script references AWS credentials.
  evidence_fields: []
  context_strategy: file
  references:
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
  remediation_hint: Remove AWS credential access from lifecycle scripts.
