metadata:
  id: package.lifecycle_credential_access
  name: Credential Access in Lifecycle Script
  description: Detects access to npm, GitHub, or AWS credentials from lifecycle scripts.
  severity: high
  confidence: high
  tags: [npm, credentials, lifecycle]
  category: credential-access
  namespace: builtin
  rule_source: builtin
  rule_version: "1.0.0"
  schema_version: "1"
  min_engine_version: "0.1.0"
  references:
    - https://github.com/DNSZLSK/muad-dib/blob/master/src/rules/index.js
scope: file
selectors:
  ecosystems: [npm]
  path_glob: ["package.json"]
conditions:
  regex:
    pattern: '(?is)"(?:preinstall|install|postinstall|prepare|prepack)"\s*:\s*"[^"\n]*(?:\.npmrc|GITHUB_TOKEN|NPM_TOKEN|AWS_[A-Z_]+)'
emit:
  finding_name: lifecycle_credential_access
  message: package.json lifecycle script references a sensitive credential file or environment variable.
  evidence_fields: []
  context_strategy: file
  references:
    - https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions
  remediation_hint: Remove credential access from lifecycle scripts unless strictly required.
