metadata:
  id: ast.credential_access
  name: AST Credential Access
  description: Detects JavaScript AST access to sensitive files or tokens.
  severity: high
  confidence: high
  tags: [ast, credentials]
  category: credential-access
  namespace: builtin
  rule_source: builtin
  rule_version: "1.0.0"
  schema_version: "1"
  min_engine_version: "0.1.0"
scope: package
selectors:
  required_scanners: [ast_credential_access]
conditions:
  scanner_signal_exists: ast_credential_access
emit:
  finding_name: ast_credential_access
  message: JavaScript AST indicates access to sensitive credentials or files.
  evidence_fields: []
  context_strategy: package
  references: []
  remediation_hint: Review token and credential access in JavaScript source.
