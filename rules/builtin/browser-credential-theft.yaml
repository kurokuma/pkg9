metadata:
  id: browser.credential_theft
  name: Browser Credential Theft
  description: Detects theft of browser cookies, stored credentials, or session tokens paired with exfiltration.
  severity: critical
  confidence: high
  tags: [browser, credentials, exfiltration]
  category: exfiltration
  namespace: builtin
  rule_source: builtin
  rule_version: "1.0.0"
  schema_version: "1"
  min_engine_version: "0.1.0"
scope: package
selectors:
  required_scanners: [browser_credential_theft]
conditions:
  scanner_signal_exists: browser_credential_theft
emit:
  finding_name: browser_credential_theft
  message: Package accesses browser credential stores or session tokens and exfiltrates them.
  evidence_fields: []
  context_strategy: package
  references:
    - https://attack.mitre.org/techniques/T1555/
  remediation_hint: Review whether browser cookies, Login Data, Local State, or similar stores are collected and sent externally.
