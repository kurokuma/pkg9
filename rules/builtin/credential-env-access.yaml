metadata:
  id: source.credential_env_access
  name: Credential Environment Access
  description: Detects references to sensitive tokens or cloud credentials.
  severity: high
  confidence: high
  tags: [source, env, credentials]
  category: credential-access
  namespace: builtin
  rule_source: builtin
  rule_version: "1.0.0"
  schema_version: "1"
  min_engine_version: "0.1.0"
  references:
    - https://github.com/DNSZLSK/muad-dib/blob/master/src/rules/index.js
scope: file
selectors:
  classifications: [source]
conditions:
  regex:
    pattern: '(?i)(?:GITHUB_TOKEN|NPM_TOKEN|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|SLACK_WEBHOOK_URL|DISCORD_WEBHOOK_URL)'
emit:
  finding_name: credential_env_access
  message: Source file references a sensitive environment variable.
  evidence_fields: []
  context_strategy: file
  references:
    - https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions
  remediation_hint: Review whether the code accesses secrets or transmits them externally.
