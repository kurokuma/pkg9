  description: Detects Python access to environment secrets or credential files.
  severity: high
  confidence: high
  tags: [python, credentials]
  category: credential-access
  namespace: builtin
  rule_source: builtin
  rule_version: "1.0.0"
  schema_version: "1"
  min_engine_version: "0.1.0"
scope: package
selectors:
  required_scanners: [python_credential_access]
conditions:
  scanner_signal_exists: python_credential_access
emit:
  finding_name: python_credential_access
  message: Python code accesses environment secrets or credential files.
  evidence_fields: []
  context_strategy: package
  references: []
  remediation_hint: Review secret handling and whether values are later transmitted or executed.
