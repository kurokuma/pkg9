metadata:
  id: pkg.dependency.ioc
  name: suspicious dependency IOC
  description: Detects dependencies matching a built-in IOC list.
  severity: high
  confidence: medium
  tags: [dependency, ioc]
  category: dependency
  namespace: builtin
  rule_source: builtin
  rule_version: "1.0.0"
  schema_version: "1"
  min_engine_version: "0.1.0"
  references: []
scope: package
selectors:
  required_scanners: [dependency_ioc]
conditions:
  scanner_signal_exists: dependency_ioc
emit:
  finding_name: suspicious_dependency_detected
  message: Scanner matched a dependency against the IOC list.
  evidence_fields: []
  context_strategy: package
  references: []
  remediation_hint: Remove or verify the flagged dependency.
