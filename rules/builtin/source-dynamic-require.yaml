metadata:
  id: source.dynamic_require
  name: Dynamic Require with Concatenation
  description: Detects require() where the module name is built dynamically.
  severity: high
  confidence: high
  tags: [source, obfuscation]
  category: obfuscation
  namespace: builtin
  rule_source: builtin
  rule_version: "1.0.0"
  schema_version: "1"
  min_engine_version: "0.1.0"
  references:
    - https://raw.githubusercontent.com/DNSZLSK/muad-dib/master/src/rules/index.js
scope: file
selectors:
  classifications: [source]
  languages: [javascript]
conditions:
  regex:
    pattern: '(?is)\brequire\s*\(\s*["''][^"'']+["'']\s*\+\s*["''][^"'']+["'']'
emit:
  finding_name: dynamic_require
  message: Source file uses require() with string concatenation.
  evidence_fields: []
  context_strategy: file
  references:
    - https://attack.mitre.org/techniques/T1027/
  remediation_hint: Review whether dynamic require is hiding the imported module name.
