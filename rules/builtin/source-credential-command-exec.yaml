metadata:
  id: source.credential_command_exec
  name: Credential Theft via CLI Tool
  description: Detects command execution strings that invoke common auth CLI commands.
  severity: critical
  confidence: high
  tags: [source, credentials]
  category: credential-access
  namespace: builtin
  rule_source: builtin
  rule_version: "1.0.0"
  schema_version: "1"
  min_engine_version: "0.1.0"
  references:
    - https://raw.githubusercontent.com/DNSZLSK/muad-dib/master/src/rules/index.js
scope: file
selectors:
  classifications: [source]
conditions:
  regex:
    pattern: '(?is)\b(?:exec|execSync)\s*\([^\n]{0,1000}(?:gh\s+auth\s+token|gcloud\s+auth|aws\s+sts)'
emit:
  finding_name: credential_command_exec
  message: Source file executes a CLI command that can expose authentication tokens.
  evidence_fields: []
  context_strategy: file
  references:
    - https://attack.mitre.org/techniques/T1059/
  remediation_hint: Review whether CLI auth commands are being abused for credential theft.
