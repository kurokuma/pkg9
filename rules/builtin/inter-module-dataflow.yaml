metadata:
  id: dataflow.inter_module
  name: Inter-module Suspicious Dataflow
  description: Detects cross-file source-to-sink relationships through imports.
  severity: critical
  confidence: medium
  tags: [dataflow, cross-file]
  category: behavior
  namespace: builtin
  rule_source: builtin
  rule_version: "1.0.0"
  schema_version: "1"
  min_engine_version: "0.1.0"
  references:
    - https://github.com/DNSZLSK/muad-dib/blob/master/src/rules/index.js
scope: package
selectors:
  required_scanners: [inter_module_dataflow]
conditions:
  scanner_signal_exists: inter_module_dataflow
emit:
  finding_name: inter_module_dataflow
  message: Package contains a cross-file path from sensitive source access toward a sink within three import hops.
  evidence_fields: []
  context_strategy: package
  references: []
  remediation_hint: Review source and imported modules for credential handling and outbound behavior.
