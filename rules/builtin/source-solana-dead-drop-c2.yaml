metadata:
  id: source.solana_dead_drop_c2
  name: Solana Dead-Drop C2
  description: Detects Solana JSON-RPC dead-drop behavior used to resolve a payload URL.
  severity: critical
  confidence: high
  tags: [source, c2, blockchain]
  category: command-and-control
  namespace: builtin
  rule_source: builtin
  rule_version: "1.0.0"
  schema_version: "1"
  min_engine_version: "0.1.0"
  references:
    - https://www.stepsecurity.io/blog/malicious-npm-releases-found-in-popular-react-native-packages---130k-monthly-downloads-compromised
scope: file
selectors:
  classifications: [source]
conditions:
  all_of:
    - regex:
        pattern: '(?is)getSignaturesForAddress'
    - regex:
        pattern: '(?is)(?:api\.mainnet-beta\.solana\.com|rpc\.ankr\.com/solana|solana-rpc\.publicnode\.com)'
    - regex:
        pattern: '(?is)\b(?:link|memo\.link|payloadUrl|downloadUrl)\b'
emit:
  finding_name: solana_dead_drop_c2
  message: Source file uses Solana JSON-RPC responses as a dead-drop to resolve a payload URL.
  evidence_fields: []
  context_strategy: file
  references:
    - https://attack.mitre.org/techniques/T1105/
  remediation_hint: Review whether blockchain RPC traffic is being used to obtain a second-stage payload URL.
