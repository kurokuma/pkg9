metadata:
  id: shell.netcat_shell
  name: Netcat Shell
  description: Detects netcat reverse shell patterns.
  severity: critical
  confidence: high
  tags: [shell, reverse-shell]
  category: execution
  namespace: builtin
  rule_source: builtin
  rule_version: "1.0.0"
  schema_version: "1"
  min_engine_version: "0.1.0"
  references:
    - https://raw.githubusercontent.com/DNSZLSK/muad-dib/master/src/rules/index.js
scope: file
selectors:
  path_glob: ["*.sh", "*.bash", "*.zsh"]
conditions:
  regex:
    pattern: '(?is)\bnc\s+-e\s+/bin/(?:ba)?sh\b'
emit:
  finding_name: shell_netcat_shell
  message: Shell script contains a netcat reverse shell pattern.
  evidence_fields: []
  context_strategy: file
  references:
    - https://attack.mitre.org/techniques/T1059/004/
  remediation_hint: Remove reverse shell behavior and review the package origin.
